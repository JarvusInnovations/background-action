name: "Tests"
on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - run: npm ci
    - run: npm run lint

  # workflows carry a lot of shell; actionlint runs shellcheck over every run: block
  actionlint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker://rhysd/actionlint:1.7.12
      with:
        args: -color

  # unit tests
  jest:
    # macos runners ship bash 3.2, which is the only place the pid-polling fallback runs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4
    - run: npm ci
    - run: npm test

    # the suite must write logs to RUNNER_TEMP; stray files here are gitignored, so they are
    # easy to miss locally and ncc will happily bundle one into dist/
    - name: Ensure the test run left no log files in the workspace
      run: |
        leftover=$(find . -path ./node_modules -prune -o \( -name '*.out' -o -name '*.err' \) -print)
        if [ -n "$leftover" ]; then
          echo "Test run left log files behind:"
          echo "$leftover"
          exit 1
        fi

  success:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm install
    - uses: ./
      with:
        run: |
          PORT=1212 node test/server.js &
          PORT=2121 node test/server.js &
          PORT=3232 node test/server.js &
        wait-on: |
          http://localhost:1212/bar
          tcp:localhost:1212
          http://localhost:2121/bar
          tcp:localhost:2121
          http://localhost:3232/bar
          tcp:localhost:3232
        log-output-resume: stderr
        tail: true
        wait-for: 5m
        log-output: stderr,stdout
    - run: sleep 30 # allow stderr to get output in the background
